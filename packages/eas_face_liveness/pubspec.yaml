name: eas_face_liveness
description: Local two-model passive face anti-spoofing for eas_face on Android and iOS.
version: 0.1.1
publish_to: none
environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: '>=3.29.0'
platforms:
  android:
  ios:
dependencies:
  flutter:
    sdk: flutter
  eas_face:
    path: ../eas_face
  flutter_onnxruntime: 1.9.0
  image: ^4.5.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  assets:
    - assets/models/minifasnet_v2.onnx
    - assets/models/minifasnet_v1se.onnx
    - licenses/minifasnet.LICENSE
